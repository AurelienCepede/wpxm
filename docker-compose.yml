services:
  web:
    build:
      context: ./wp-config
      args:
        WP_VERSION: ${DOCKER_IMAGE_WP_VERSION}
        PHP_VERSION: ${DOCKER_IMAGE_PHP_VERSION}
    image: ${DOCKER_IMAGE_WEB}:wp${DOCKER_IMAGE_WP_VERSION}-php${DOCKER_IMAGE_PHP_VERSION}
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./wp-config/php-config.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./www:/var/www/html
      - ./plugins:/var/plugins
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.wpxm-web.rule=Host(`wpxm.localhost`)"
      - "traefik.http.routers.wpxm-web.entrypoints=websecure"
      - "traefik.http.routers.wpxm-web.tls=true"
      - "traefik.http.services.wpxm-web.loadbalancer.server.port=80"

  db:
    image: mariadb:11.4
    command: [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci'
    ]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
    # No external network — db stays private to the wpxm stack.

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
    volumes:
      - ./wp-config/php-config.ini:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.wpxm-pma.rule=Host(`pma.wpxm.localhost`)"
      - "traefik.http.routers.wpxm-pma.entrypoints=websecure"
      - "traefik.http.routers.wpxm-pma.tls=true"
      - "traefik.http.services.wpxm-pma.loadbalancer.server.port=80"

  mailpit:
    image: axllent/mailpit
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.wpxm-mail.rule=Host(`mail.wpxm.localhost`)"
      - "traefik.http.routers.wpxm-mail.entrypoints=websecure"
      - "traefik.http.routers.wpxm-mail.tls=true"
      - "traefik.http.services.wpxm-mail.loadbalancer.server.port=8025"

networks:
  traefik:
    external: true
